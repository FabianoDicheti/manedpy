[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manedpy"
version = "0.0.0"
description = "Call .mnd scripts from Python, in-process (scaffold; not functional yet)"
readme = "README.md"
requires-python = ">=3.9"
# Once the wheel bundles libmaned_c this MUST become license-files listing both
# LICENSE (Apache-2.0) and LICENSE-libmaned_c — see MANEDPY_PLAN.md §8.2. A bare
# SPDX "Apache-2.0" would misdescribe the wheel.
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["manedpy"]
